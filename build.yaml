---
include:
  - board: nice_nano_v2
    shield: eyelash_sofle_central_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_sofle_central_dongle_oled
  # Trackpad target (task 04): stock dongle + input from the right half's TPS65.
  - board: nice_nano_v2
    shield: eyelash_sofle_central_dongle dongle_display tps65_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_sofle_central_dongle_oled_tps65
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_left nice_view 
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_right nice_view
  - board: nice_nano_v2
    shield: settings_reset
  # Debug target (task 04c step 10e E5): right half with the AYM1607 driver and USB logging,
  # log held 45 s (no sleep add-on).
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_right tps65_right_aym
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=45000 -DCONFIG_LOG_BUFFER_SIZE=16384 -DCONFIG_LOG_MODE_OVERFLOW=n
    artifact-name: eyelash_sofle_peripheral_right_aym_late
  # Trackpad target (task 04 step 11): right half with the AYM1607 driver, no logging.
  # Final firmware (task 08 step 7b): + sleep add-on (pad in reset while asleep), deep sleep after 30 min.
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_right tps65_right_aym tps65_sleepreset_right
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
    artifact-name: eyelash_sofle_peripheral_right_aym
  # Trackpad target (task 07 step 2): left half with the AYM1607 driver, no logging.
  # Final firmware (task 08 step 7b): + sleep add-on (pad in reset while asleep), deep sleep after 30 min.
  # No nice_view, display off, roller off (in the overlay): P0.06/P0.17/P0.20 and P1.10 only for the pad.
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_left tps65_left_aym tps65_sleepreset_left
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
    artifact-name: eyelash_sofle_peripheral_left_aym
  # Debug target (task 07 step 2): as above, with USB logging held 45 s (for step 6 if the pad fails).
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_left tps65_left_aym
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=45000 -DCONFIG_LOG_BUFFER_SIZE=16384 -DCONFIG_LOG_MODE_OVERFLOW=n
    artifact-name: eyelash_sofle_peripheral_left_aym_late
