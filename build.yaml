---
include:
  - board: nice_nano_v2
    shield: eyelash_sofle_central_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_sofle_central_dongle_oled
  # Trackpad target (task 04): stock dongle + input from the right half's TPS65.
  - board: nice_nano_v2
    shield: eyelash_sofle_central_dongle dongle_display tps65_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_sofle_central_dongle_oled_tps65
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_left nice_view 
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_right nice_view
  - board: nice_nano_v2
    shield: settings_reset
  # Test target (task 02): right half + TPS65 trackpad, no nice_view.
  # Display off here: config/eyelash_sofle.conf turns it on for all builds.
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_right tps65_right
    cmake-args: -DCONFIG_ZMK_DISPLAY=n
    artifact-name: eyelash_sofle_peripheral_right_tps65
  # Debug target (task 04 step 1b): right half + TPS65 + USB logging.
  # Prints key scan, split link and trackpad driver messages to a USB serial port.
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_right tps65_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_DISPLAY=n
    artifact-name: eyelash_sofle_peripheral_right_tps65_usblog
  # Debug target (task 04 step 10c): as above, but the log is held for 45 s
  # (16 KB buffer, keep oldest), so the driver's start-up lines survive until USB is up.
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_right tps65_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=45000 -DCONFIG_LOG_BUFFER_SIZE=16384 -DCONFIG_LOG_MODE_OVERFLOW=n
    artifact-name: eyelash_sofle_peripheral_right_tps65_usblog_late
  # Test target (task 04 step 10d): as above, with SDA/SCL swapped (tps65_swap).
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_right tps65_right tps65_swap
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=45000 -DCONFIG_LOG_BUFFER_SIZE=16384 -DCONFIG_LOG_MODE_OVERFLOW=n
    artifact-name: eyelash_sofle_peripheral_right_tps65_swap_late
  # Test target (task 04 step 10e E4): as the late-log build, with I2C at 100 kHz (tps65_slow).
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_right tps65_right tps65_slow
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=45000 -DCONFIG_LOG_BUFFER_SIZE=16384 -DCONFIG_LOG_MODE_OVERFLOW=n
    artifact-name: eyelash_sofle_peripheral_right_tps65_slow_late
  # Test target (task 04c step 10e E5): right half with the AYM1607 IQS5xx driver
  # (tps65_right_aym instead of tps65_right), log held 45 s.
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_right tps65_right_aym
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=45000 -DCONFIG_LOG_BUFFER_SIZE=16384 -DCONFIG_LOG_MODE_OVERFLOW=n
    artifact-name: eyelash_sofle_peripheral_right_aym_late
  # Trackpad target (task 04 step 11): right half with the AYM1607 driver, no logging.
  # Final firmware (task 08 step 7b): + sleep add-on (pad in reset while asleep), deep sleep after 30 min.
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_right tps65_right_aym tps65_sleepreset_right
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
    artifact-name: eyelash_sofle_peripheral_right_aym
  # Test target (task 08 step 4b), not for daily use: as above, deep sleep after 1 min and
  # no USB stack, so the half doesn't see USB power and deep-sleeps on the USB meter.
  # RGB off at start: without the USB stack, RGB_UNDERGLOW_AUTO_OFF_USB (keeps it off on battery) is gone.
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_right tps65_right_aym
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=60000 -DCONFIG_USB_DEVICE_STACK=n -DCONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
    artifact-name: eyelash_sofle_peripheral_right_aym_1min
  # Test target (task 08 step 6b), not for daily use: as above + pad held in reset while asleep,
  # deep sleep after 1 min, no USB stack (as step 4b).
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_right tps65_right_aym tps65_sleepreset_right
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=60000 -DCONFIG_USB_DEVICE_STACK=n -DCONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
    artifact-name: eyelash_sofle_peripheral_right_aym_sleepreset_1min
  # Trackpad target (task 07 step 2): left half with the AYM1607 driver, no logging.
  # Final firmware (task 08 step 7b): + sleep add-on (pad in reset while asleep), deep sleep after 30 min.
  # No nice_view, display off, roller off (in the overlay): P0.06/P0.17/P0.20 and P1.10 only for the pad.
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_left tps65_left_aym tps65_sleepreset_left
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
    artifact-name: eyelash_sofle_peripheral_left_aym
  # Test target (task 08 step 6b), not for daily use: as above + pad held in reset while asleep,
  # deep sleep after 1 min, no USB stack (as step 4b).
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_left tps65_left_aym tps65_sleepreset_left
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_ZMK_IDLE_SLEEP_TIMEOUT=60000 -DCONFIG_USB_DEVICE_STACK=n -DCONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
    artifact-name: eyelash_sofle_peripheral_left_aym_sleepreset_1min
  # Debug target (task 07 step 2): as above, with USB logging held 45 s (for step 6 if the pad fails).
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_left tps65_left_aym
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=45000 -DCONFIG_LOG_BUFFER_SIZE=16384 -DCONFIG_LOG_MODE_OVERFLOW=n
    artifact-name: eyelash_sofle_peripheral_left_aym_late
  # Debug target (task 03 step 7): stock left half + USB logging.
  # Prints key scan and split link messages to a USB serial port.
  - board: nice_nano_v2
    shield: eyelash_sofle_peripheral_left nice_view
    snippet: zmk-usb-logging
    artifact-name: eyelash_sofle_peripheral_left_usblog
